<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DDS3 Model Preview</title>
<style>
:root{color-scheme:dark;font:14px system-ui,sans-serif;background:#10151d;color:#dfe8f4}*{box-sizing:border-box}body{margin:0;display:grid;grid-template-columns:310px 1fr;height:100vh;overflow:hidden}aside{min-height:0;padding:22px 16px;background:#171e29;display:flex;flex-direction:column;gap:12px;border-right:1px solid #303a4a}h1{font-size:20px;margin:0}small,.muted{color:#9caec5;font-size:12px}input,select,button{font:inherit;color:inherit;background:#202b3b;border:1px solid #3c4c63;border-radius:6px;padding:8px}button{cursor:pointer}button:hover{background:#31425b}button:disabled{opacity:.45;cursor:default}#library{flex:1;overflow:auto;min-height:80px}.item{display:block;width:100%;text-align:left;border-color:transparent;border-bottom:1px solid #283345;border-radius:0;padding:9px;background:transparent}.item.selected{background:#293f58;border-left:3px solid #7ce3c0}.item small{display:block;overflow-wrap:anywhere;font-size:10px;margin-top:4px}main{min-width:0;min-height:0;display:flex;flex-direction:column}header{padding:18px 24px;border-bottom:1px solid #303a4a;display:flex;justify-content:space-between;align-items:center;gap:12px}h2{font-size:18px;margin:0 0 4px}#viewport{flex:1;position:relative;min-height:0}canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}#hint{position:absolute;bottom:15px;left:20px;color:#9aaac0;font-size:12px;pointer-events:none}#notice{position:absolute;top:18px;left:20px;right:20px;background:#171e29dd;border:1px solid #536176;border-radius:8px;padding:14px;white-space:pre-wrap;max-height:35%;overflow:auto}#notice:empty{display:none}footer{padding:14px 24px 20px;background:#171e29;border-top:1px solid #303a4a}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.timeline{display:flex;gap:12px;align-items:center;margin-top:14px}#frame{flex:1;padding:0;accent-color:#7ce3c0}label{display:inline-flex;gap:5px;align-items:center}#motion{max-width:370px}#stats{font-variant-numeric:tabular-nums}#bones{width:160px}#frameText{width:110px;font-size:12px;font-variant-numeric:tabular-nums}#count{font-size:12px;color:#9caec5}#upload{display:none}@media(max-width:800px){body{grid-template-columns:230px 1fr}aside{min-height:0;padding:14px 10px}header,footer{padding:12px}.row{gap:6px}}
@media(max-width:600px){body{grid-template-columns:1fr;grid-template-rows:210px minmax(0,1fr)}aside{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto minmax(0,1fr);gap:6px;border-right:0;border-bottom:1px solid #303a4a}aside>small{display:none}aside h1{font-size:16px;grid-column:1;grid-row:1}#open{grid-column:2;grid-row:1;padding:5px;font-size:12px}#source{grid-column:1;grid-row:2}#search{grid-column:2;grid-row:2;width:100%}#count{grid-column:1/-1;grid-row:3}#library{grid-column:1/-1;grid-row:4}.item{padding:6px}footer{font-size:12px}input,select,button{padding:5px}h2{font-size:16px}#hint{font-size:10px;left:10px;bottom:8px}#motion{max-width:180px}#stats{font-size:10px}}
</style></head><body>
<aside><h1>DDS3 <span style="color:#7ce3c0">Preview</span></h1><small>Nocturne · Devil Summoner 2</small><select id="source" aria-label="Game"><option value="">All games</option></select><input id="search" type="search" placeholder="Search demon, ID, or path" aria-label="Search models"><span id="count"></span><div id="library" role="list" aria-label="Models"></div><button id="open">Open local PB / LB…</button><input type="file" id="upload" accept=".pb,.lb"><small>Read-only preview · original files stay unchanged</small></aside>
<main><header><div><h2 id="title">Choose a demon</h2><small id="stats">Browse your game archives or open a model file.</small></div><button id="reset">Reset camera</button></header><div id="viewport"><canvas id="canvas" aria-label="3D model preview"></canvas><div id="notice" role="status"></div><div id="hint">Drag to orbit · scroll to zoom · right-drag to pan</div></div>
<footer><div class="row"><label>Labels <select id="labelGame" aria-label="Slot label game"><option value="auto">Automatic</option><option value="ds2">Devil Summoner 2</option><option value="nocturne">Nocturne</option></select></label><select id="motion" aria-label="Animation" disabled><option value="-1">Rest pose</option></select><button id="play" disabled>Play</button><button id="prev" disabled aria-label="Previous frame">◀</button><button id="next" disabled aria-label="Next frame">▶</button><label>Speed <select id="speed"><option value="0.25">¼×</option><option value="0.5">½×</option><option selected value="1">1×</option><option value="2">2×</option></select></label><label>FPS <select id="fps"><option selected>30</option><option>60</option></select></label><label><input id="loop" type="checkbox" checked>Loop</label></div><div class="timeline"><input type="range" id="frame" min="0" max="0" value="0" step="1" disabled aria-label="Frame"><span id="frameText">Frame —</span></div><div class="row" style="margin-top:12px"><label><input id="textured" type="checkbox" checked>Textures</label><label><input id="wire" type="checkbox">Wireframe</label><label><input id="skeleton" type="checkbox">Skeleton</label><select id="bones" aria-label="Highlight bone"><option value="-1">Highlight bone…</option></select><label><input id="grid" type="checkbox" checked>Grid</label></div></footer></main>
<script type="module" src="./viewer.js"></script></body></html>
